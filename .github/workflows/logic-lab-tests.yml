name: Logic Lab tests

on:
  push:
    branches: [main]
    paths:
      - 'logic-lab/**'
      - '.github/workflows/logic-lab-tests.yml'
  pull_request:
    paths:
      - 'logic-lab/**'
      - '.github/workflows/logic-lab-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: logic-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
